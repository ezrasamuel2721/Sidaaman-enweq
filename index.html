<!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f35"><title>የሲዳማን እንወቅ</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f7f6f1;--card:#fff;--ink:#17352e;--muted:#66736e;--line:#e5e4dc;--accent:#b28a43;--soft:#eef3ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Ethiopic",sans-serif;line-height:1.7}header{position:sticky;top:0;z-index:10;background:#f7f6f1ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}nav{max-width:1050px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between}.brand{font-weight:900;font-size:20px}main{max-width:1050px;margin:auto;padding:25px 18px 60px}h1{font-size:clamp(28px,6vw,48px);margin:0}.muted{color:var(--muted)}.search{display:flex;gap:8px;margin:18px 0}.search input{flex:1;padding:14px;border:1px solid var(--line);border-radius:14px;font-size:16px}.btn,.back{border:0;border-radius:14px;padding:12px 16px;background:var(--ink);color:#fff;font-weight:800}.langs{display:flex;gap:7px;flex-wrap:wrap}.lang{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px}.active{background:var(--soft)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card,.item,.article,.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.card,.item{cursor:pointer}.card h3,.item h3{margin:0}.card small,.item small{color:var(--muted)}.list{display:grid;gap:10px}.section{margin-top:20px}.body{white-space:pre-wrap}.meta{border-top:1px solid var(--line);margin-top:20px;padding-top:12px;color:var(--muted);font-size:13px}footer{text-align:center;padding:30px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}@media(max-width:600px){.search{flex-direction:column}.btn{width:100%}}</style></head><body><header><nav><div class="brand">የሲዳማን እንወቅ</div><span class="muted">ታሪክ • ባህል • ቋንቋ • ማንነት</span></nav></header><main><h1>የሲዳማን እንወቅ</h1><p class="muted">የሲዳማን ታሪክ፣ ባህል፣ ቋንቋ፣ ኪነ-ጥበብ፣ ሥነ-ጽሑፍ፣ ስፖርት እና የዛሬውን ማኅበረሰብ በምንጭ የተደገፈ መረጃ ይወቁ።</p><div id="langs" class="langs"></div><div class="search"><input id="q" placeholder="ርዕስ፣ ቦታ፣ ተቋም ወይም ቁልፍ ቃል ፈልግ"><button class="btn" id="go">ፈልግ</button></div><div id="app" class="empty">መረጃውን በመጫን ላይ…</div></main><footer>የሲዳማን እንወቅ</footer><script>const URL='https://geznekrpdubpgsegseer.supabase.co',KEY='sb_publishable_v6cciBIeO_Gr3q3ZHto2vQp9vl6e',db=supabase.createClient(URL,KEY);let L='am',topics=[],articles=[];const F={am:['አማርኛ','title_am','summary_am','content_am'],sid:['Sidaamu Afoo','title_sid','summary_sid','content_sid'],en:['English','title_en','summary_en','content_en']};const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])),title=x=>x?.[F[L][1]]||x?.title_am||x?.title_en||'';function langs(){ $('langs').innerHTML=Object.entries(F).map(([k,v])=>`<button class="lang ${L==k?'active':''}" data-l="${k}">${v[0]}</button>`).join('');document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{L=b.dataset.l;langs();home()})}function children(id){return topics.filter(x=>x.parent_id===id).sort((a,b)=>a.sort_order-b.sort_order)}function home(){ $('app').className='grid';$('app').innerHTML=topics.filter(x=>!x.parent_id).sort((a,b)=>a.sort_order-b.sort_order).map(x=>`<div class="card" data-t="${x.id}"><h3>${esc(title(x))}</h3><small>${children(x.id).length} ንዑስ ርዕሶች</small></div>`).join('');document.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>topic(x.dataset.t))}function topic(id){let t=topics.find(x=>x.id===id),c=children(id);$('app').className='section';$('app').innerHTML=`<button class="back" id="back">← ወደ ዋና ገጽ</button><h2>${esc(title(t))}</h2><div class="list">${c.map(x=>`<div class="item" data-s="${x.id}"><h3>${esc(title(x))}</h3></div>`).join('')||'<div class="empty">የተዘጋጀ ንዑስ ርዕስ የለም።</div>'}</div>`;$('back').onclick=home;document.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>sub(x.dataset.s))}function sub(id){let t=topics.find(x=>x.id===id),a=articles.filter(x=>x.topic_id===id);$('app').innerHTML=`<button class="back" id="back">← ተመለስ</button><h2>${esc(title(t))}</h2><div class="list">${a.map(x=>`<div class="item" data-a="${x.id}"><h3>${esc(title(x))}</h3><small>${esc(x[F[L][2]]||x.summary_am||'')}</small></div>`).join('')||'<div class="empty">ይህ ንዑስ ርዕስ እስካሁን የታተመ ጽሑፍ የለውም።</div>'}</div>`;$('back').onclick=()=>topic(t.parent_id);document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>article(x.dataset.a))}function article(id){let a=articles.find(x=>x.id===id),t=topics.find(x=>x.id===a.topic_id);$('app').innerHTML=`<article class="article"><button class="back" id="back">← ተመለስ</button><h2>${esc(title(a))}</h2><p><b>${esc(a[F[L][2]]||a.summary_am||'')}</b></p><div class="body">${esc(a[F[L][3]]||a.content_am||'')}</div><div class="meta">የታተመ እና በእውነታ ግምገማ የተረጋገጠ ጽሑፍ</div></article>`;$('back').onclick=()=>sub(t.id)}async function load(){let [t,a]=await Promise.all([db.from('sidama_topics').select('*').eq('is_active',true).order('sort_order'),db.from('sidama_articles').select('*').eq('editorial_status','published').order('sort_order').limit(1000)]);if(t.error||a.error){$('app').textContent='መረጃውን መጫን አልተቻለም።';return}topics=t.data||[];articles=a.data||[];langs();home()}$('go').onclick=async()=>{let q=$('q').value.trim();if(!q)return home();let r=await db.from('sidama_articles').select('*').eq('editorial_status','published').or(`title_am.ilike.%${q}%,title_sid.ilike.%${q}%,title_en.ilike.%${q}%,summary_am.ilike.%${q}%,summary_en.ilike.%${q}%`).limit(40);let a=r.data||[];$('app').innerHTML=`<button class="back" id="back">← ወደ ዋና ገጽ</button><h2>የፍለጋ ውጤት</h2><div class="list">${a.map(x=>`<div class="item" data-a="${x.id}"><h3>${esc(title(x))}</h3></div>`).join('')||'<div class="empty">ምንም የታተመ ውጤት አልተገኘም።</div>'}</div>`;$('back').onclick=home;document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>article(x.dataset.a))};load();</script></body></html>
