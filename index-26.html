<style>
*{box-sizing:border-box}

:root{
  --primary:#087443;
  --primary-dark:#055a34;
  --secondary:#e8f5ee;
  --background:#f5f8f6;
  --card:#ffffff;
  --text:#17251f;
  --muted:#66756e;
  --border:#dce7e1;

body{
  margin:0;
  background:var(--background);

}

button,
input{
  font:inherit;

button{

}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  color:var(--primary-dark);

  font-size:1.2rem;
}

.nav-actions{

}

.btn{
  border:1px solid var(--border);

}

.btn:hover{

}

.btn.primary{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

main{
  max-width:1200px;

  padding:18px 16px 45px;
}

.hero{
  background:linear-gradient(135deg,#e2f4ea,#ffffff);
  border:1px solid var(--border);
  border-radius:24px;
  padding:34px 22px;
  margin-bottom:22px;
  box-shadow:var(--shadow);
}

.hero h1{

  color:var(--primary-dark);
  font-size:clamp(1.9rem,5vw,3rem);
}

.hero p{
  margin:8px 0 20px;
  color:var(--muted);

}

.languages{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px;
}

.language{
  border:1px solid var(--border);

  border-radius:999px;
  padding:8px 15px;
}

.language.active{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

.search-box{
  display:flex;
  gap:8px;
}

.search-box input{
  flex:1;
  min-width:0;
  border:1px solid var(--border);
  background:#fff;
  border-radius:12px;
  padding:13px 15px;
  outline:none;
}

.search-box input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(8,116,67,.1);
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:20px 0 13px;
}

.section-title h2{
  margin:0;
  font-size:1.35rem;
  color:var(--primary-dark);
}

.meta{
  color:var(--muted);
  font-size:.9rem;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:14px;
}

.card{
  width:100%;
  text-align:left;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  box-shadow:var(--shadow);

}

.card:hover{

  border-color:#a9cbbb;
}

.card h3{
  margin:0 0 8px;
  color:var(--primary-dark);

}

.card p{
  margin:0;
  color:var(--muted);
  line-height:1.7;
}

.back{
  margin-bottom:14px;
}

.article{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:30px;
  box-shadow:var(--shadow);
  max-width:1000px;
  margin:0 auto;
}

.article h1{
  margin:0 0 14px;
  color:var(--primary-dark);
  font-size:clamp(1.6rem,4vw,2.4rem);
  line-height:1.45;
}

.article-summary{
  color:var(--muted);

  padding:14px 16px;
  background:var(--secondary);
  border-radius:12px;
  font-size:1rem;
}

.article-content{

/*

*/

}

}

  font-size:1.45rem;

}

.article-content h3{

.article-content ul,

}

.article-sources{

}

.article-sources p{
  margin:0;

.reader-info{

}

.notice{

}

footer{

  padding:28px 16px;
}

footer a{

}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

.menu-item{
  width:100%;
  padding:13px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:12px;
  text-align:left;
}

.menu-item:hover{

}

.panel{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  padding:24px;
  box-shadow:var(--shadow);
}

.panel h2{
  margin-top:0;
  color:var(--primary-dark);
}

.stat-grid{

.stat{

  padding:18px;

}

.stat strong{
  display:block;

}

dialog{

  border-radius:20px;
  width:min(720px,calc(100% - 24px));

dialog::backdrop{

.dialog-body{

}

.dialog-body h2{

}

.dialog-footer{
  margin-top:18px;

}

.hidden{
  display:none!important;
}

.dark{
  --background:#111815;
  --card:#18221e;
  --text:#edf5f1;
  --muted:#aebdb5;
  --border:#304139;
  --secondary:#20352b;

.dark header{

.dark .btn,
.dark .language,
.dark .menu-item,
.dark .search-box input,

}

.dark .article,

}

.dark .article-content{

.dark footer{

}

@media(max-width:650px){

  .nav{

  }

  }

  .search-box .btn{

  }

  .article{
    padding:20px 16px;
  }

  .article-content{
    font-size:1.08rem;
    line-height:2;
  }
}
</style>

<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  'https://geznekrpdubpgsegseer.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_v6cciBIeO_Gr3q3ZHto2vQ_wQp9vl6e';

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   LANGUAGES
   ========================================================= */

const LANGUAGES = {

  sid:{
    name:'Sidaamu Afoo',
    title:'title_sid',
    summary:'summary_sid',
    content:'content_sid'
  },

  am:{
    name:'አማርኛ',
    title:'title_am',
    summary:'summary_am',
    content:'content_am'
  },

  en:{
    name:'English',
    title:'title_en',
    summary:'summary_en',
    content:'content_en'
  }

};

let currentLanguage='am';

let topics=[];
let articles=[];

let currentTopicId=null;


/* =========================================================
   HELPERS
   ========================================================= */

const $=id=>document.getElementById(id);


function escapeHTML(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');

}


function getTitle(item){

  if(!item) return '';

  const field =
    LANGUAGES[currentLanguage].title;

  return (
    item[field] ||
    item.title_am ||
    item.title_sid ||
    item.title_en ||
    ''
  );

}


function getSummary(item){

  if(!item) return '';

  const field =
    LANGUAGES[currentLanguage].summary;

  return (
    item[field] ||
    item.summary_am ||
    item.summary_sid ||
    item.summary_en ||
    ''
  );

}


/*
   አስፈላጊ:
   ይህ function ሙሉ content_* ይመልሳል።
   አይቆርጥም።
*/

function getContent(item){

  if(!item) return '';

  const field =
    LANGUAGES[currentLanguage].content;

  return String(
    item[field] ||
    item.content_am ||
    item.content_sid ||
    item.content_en ||
    ''
  ).trim();

}


/*
   Card ላይ ብቻ የሚታየው preview ነው።
   ሙሉ content ሲከፈት አይጠቀምበትም።
*/

function getContentPreview(item){

  const content =
    getContent(item);

  if(!content){

    return getSummary(item);

  }

  return content.length > 500
    ? content.slice(0,500).trim() + '…'
    : content;

}


/*
   ሙሉ የጽሑፍ አንቀጽ ማሳያ።

   Supabase ውስጥ content በ
   አዲስ መስመር ከተከፈለ
   እያንዳንዱ አንቀጽ <p> ይሆናል።

   HTML ከcontent ውስጥ እንዳይገባ
   escapeHTML በመጀመሪያ ይጠቀማል።
*/

function formatArticleContent(value){

  const text =
    String(value ?? '')
      .replace(/\r\n/g,'\n')
      .replace(/\r/g,'\n')
      .trim();

  if(!text){

    return `
      <p>
        የዚህ ጽሑፍ ሙሉ ይዘት አልተገኘም።
      </p>
    `;

  }

  const safe =
    escapeHTML(text);

  const paragraphs =
    safe
      .split(/\n{2,}/)
      .map(p=>p.trim())
      .filter(Boolean);

  if(!paragraphs.length){

    return `<p>${safe.replace(/\n/g,'<br>')}</p>`;

  }

  return paragraphs
    .map(p=>`

      <p>
        ${p.replace(/\n/g,'<br>')}
      </p>

    `)
    .join('');

}


/* =========================================================
   LANGUAGE UI
   ========================================================= */

function renderLanguages(){

  const box=$('languages');

  box.innerHTML =
    Object.entries(LANGUAGES)
      .map(([code,data])=>`

        <button
          class="language ${code===currentLanguage?'active':''}"
          data-language="${code}"
        >
          ${escapeHTML(data.name)}
        </button>

      `)
      .join('');


  document
    .querySelectorAll('[data-language]')
    .forEach(button=>{

      button.onclick=()=>{

        currentLanguage =
          button.dataset.language;

        renderLanguages();

        if(currentTopicId){

          openTopic(currentTopicId);

        }else{

          showHome();

        }

      };

    });

}


/* =========================================================
   TOPIC HELPERS
   ========================================================= */

function rootTopics(){

  return topics.filter(
    topic =>
      topic.parent_id===null ||
      topic.parent_id===undefined ||
      topic.parent_id==='' ||
      topic.parent_id===0
  );

}


function childTopics(parentId){

  return topics.filter(
    topic =>
      String(topic.parent_id ?? '') ===
      String(parentId)
  );

}


function topicArticles(topicId){

  return articles.filter(article =>

    String(
      article.topic_id ??
      article.category_id ??
      ''
    ) ===
    String(topicId)

  );

}


/* =========================================================
   HOME
   ========================================================= */

function showHome(){

  currentTopicId=null;

  const roots =
    rootTopics();

  $('view').innerHTML=`

    <div class="section-title">

      <h2>
        📚 ዋና የይዘት ምድቦች
      </h2>

      <span class="meta">
        ${roots.length} ምድቦች
      </span>

    </div>

    <div class="grid" id="topicGrid"></div>

  `;


  const grid =
    $('topicGrid');


  if(!roots.length){

    grid.innerHTML=`

      <div class="notice">
        የታተሙ ዋና ምድቦች አልተገኙም።
      </div>

    `;

    return;

  }


  grid.innerHTML =
    roots
      .map(topic=>`

        <button
          class="card"
          data-topic="${escapeHTML(topic.id)}"
        >

          <h3>
            ${escapeHTML(getTitle(topic))}
          </h3>

          <p>
            ${escapeHTML(getSummary(topic))}
          </p>

        </button>

      `)
      .join('');


  document
    .querySelectorAll('#topicGrid [data-topic]')
    .forEach(button=>{

      button.onclick=()=>{

        openTopic(
          button.dataset.topic
        );

      };

    });

}


/* =========================================================
   TOPIC PAGE
   ========================================================= */

function openTopic(id){

  currentTopicId=id;

  const topic =
    topics.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(!topic){

    showHome();

    return;

  }


  const children =
    childTopics(id);


  const relatedArticles =
    topicArticles(id);


  $('view').innerHTML=`

    <button
      class="btn back"
      id="backHome"
    >
      ← መነሻ
    </button>

    <div class="panel">

      <h2>
        ${escapeHTML(getTitle(topic))}
      </h2>

      <p class="meta">
        ${escapeHTML(getSummary(topic))}
      </p>

    </div>


    <div class="section-title">

      <h2>
        📂 ንዑስ ርዕሶች
      </h2>

    </div>


    <div
      class="grid"
      id="subtopicGrid"
    ></div>


    <div class="section-title">

      <h2>
        📖 የይዘት ንባብ
      </h2>

    </div>


    <div
      class="grid"
      id="articleGrid"
    ></div>

  `;


  $('backHome').onclick =
    showHome;


  const subtopicGrid =
    $('subtopicGrid');


  if(children.length){

    subtopicGrid.innerHTML =
      children
        .map(child=>`

          <button
            class="card"
            data-subtopic="${escapeHTML(child.id)}"
          >

            <h3>
              ${escapeHTML(getTitle(child))}
            </h3>

            <p>
              ${escapeHTML(getSummary(child))}
            </p>

          </button>

        `)
        .join('');

  }else{

    subtopicGrid.innerHTML=`

      <div class="notice">
        ንዑስ ርዕስ አልተገኘም።
      </div>

    `;

  }


  document
    .querySelectorAll('[data-subtopic]')
    .forEach(button=>{

      button.onclick=()=>{

        openTopic(
          button.dataset.subtopic
        );

      };

    });


  const articleGrid =
    $('articleGrid');


  if(relatedArticles.length){

    articleGrid.innerHTML =

/* =========================================================
   ARTICLE READER
   ========================================================= */

function openArticle(id){

  const article =
    articles.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(!article) return;


  const title =
    getTitle(article);


  const summary =
    getSummary(article);


  /*
     ይህ ነው ዋናው ማስተካከያ።

     ከsummary ወይም preview ሳይሆን
     በቀጥታ content_* ሙሉ ይዘት
     ይወሰዳል።
  */

  const fullContent =
    getContent(article);


  $('view').innerHTML=`

    <button
      class="btn back"
      id="backTopic"
    >
      ← ተመለስ
    </button>


    <article class="article">

      <h1>
        ${escapeHTML(title)}
      </h1>


      <div class="reader-info">

        <span class="reader-badge">
          📖 ሙሉ ጽሑፍ
        </span>

        <span class="reader-badge">
          ${escapeHTML(
            LANGUAGES[currentLanguage].name
          )}
        </span>

      </div>


      ${
        summary
        ? `
          <div class="article-summary">
            ${escapeHTML(summary)}
          </div>
        `
        : ''
      }


      <div class="article-content">

        ${formatArticleContent(fullContent)}

      </div>


      ${
        article.source_method ||
        article.factual_reviewed ||
        article.copyright_reviewed
        ? `

          <div class="article-sources">

            <h3>
              📚 የይዘት ማረጋገጫ
            </h3>

            ${
              article.source_method
              ? `
                <p>
                  <strong>Source method:</strong>
                  ${escapeHTML(
                    article.source_method
                  )}
                </p>
              `
              : ''
            }

            ${
              article.factual_reviewed !== null &&
              article.factual_reviewed !== undefined
              ? `
                <p>
                  <strong>Factual review:</strong>
                  ${
                    article.factual_reviewed
                    ? '✓ ተገምግሟል'
                    : '— ገና አልተረጋገጠም'
                  }
                </p>
              `
              : ''
            }

            ${
              article.copyright_reviewed !== null &&
              article.copyright_reviewed !== undefined
              ? `
                <p>
                  <strong>Copyright review:</strong>
                  ${
                    article.copyright_reviewed
                    ? '✓ ተገምግሟል'
                    : '— ገና አልተረጋገጠም'
                  }
                </p>
              `
              : ''
            }

          </div>

        `
        : ''
      }


      <div class="article-tools">

        <button
          class="btn"
          id="copyArticle"
        >
          📋 ቅዳ
        </button>


        <button
          class="btn"
          id="shareArticle"
        >
          📤 አጋራ
        </button>


        ${
          article.audio_am_url ||
          article.audio_sid_url ||
          article.audio_en_url
          ? `
            <button
              class="btn"
              id="audioArticle"
            >
              🔊 አዳምጥ
            </button>
          `
          : ''
        }

      </div>


      ${
        article.audio_am_url ||
        article.audio_sid_url ||
        article.audio_en_url
        ? `
          <audio
            id="articleAudio"
            controls
            style="
              width:100%;
              margin-top:15px;
              display:none;
            "
          ></audio>
        `
        : ''
      }

    </article>

  `;


  $('backTopic').onclick=()=>{

    if(currentTopicId){

      openTopic(currentTopicId);

    }else{

      showHome();

    }

  };


  /*
     COPY
  */

  $('copyArticle').onclick =
    async()=>{

      const text =
        title +
        '\n\n' +
        fullContent;

      try{

        await navigator.clipboard
          .writeText(text);

        $('copyArticle').textContent =
          '✓ ተቀድቷል';

        setTimeout(()=>{

          $('copyArticle').textContent =
            '📋 ቅዳ';

        },1500);

      }catch(e){

        alert(
          'መቅዳት አልተቻለም።'
        );

      }

    };


  /*
     SHARE
  */

  $('shareArticle').onclick =
    async()=>{

      if(navigator.share){

        try{

          await navigator.share({

            title:title,

            text:
              title +
              '\n\n' +
              fullContent,

            url:location.href

          });

        }catch(e){}

      }else{

        try{

          await navigator.clipboard
            .writeText(
              location.href
            );

          alert(
            'የገጹ አድራሻ ተቀድቷል።'
          );

        }catch(e){}

      }

    };


  /*
     AUDIO
  */

  const audioButton =
    $('audioArticle');

  const audioControl =
    $('articleAudio');


  if(audioButton && audioControl){

    audioButton.onclick=()=>{

      let audioUrl='';


      if(currentLanguage==='am'){

        audioUrl =
          article.audio_am_url ||
          article.audio_sid_url ||
          article.audio_en_url ||
          '';

      }else if(currentLanguage==='sid'){

        audioUrl =
          article.audio_sid_url ||
          article.audio_am_url ||
          article.audio_en_url ||
          '';

      }else{

        audioUrl =
          article.audio_en_url ||
          article.audio_am_url ||
          article.audio_sid_url ||
          '';

      }


      if(!audioUrl){

        alert(
          'ለዚህ ጽሑፍ የድምጽ ፋይል አልተገኘም።'
        );

        return;

      }


      audioControl.src =
        audioUrl;

      audioControl.style.display =
        'block';

      audioControl.play()
        .catch(()=>{});

    };

  }

}


/* =========================================================
   SEARCH
   ========================================================= */

function performSearch(){

  const query =
    $('searchInput')
      .value
      .trim()
      .toLowerCase();


  if(!query){

    showHome();

    return;

  }


  const results =
    articles.filter(article=>{

      const fields=[

        article.title_am,
        article.title_sid,
        article.title_en,

        article.summary_am,
        article.summary_sid,
        article.summary_en,

        article.content_am,
        article.content_sid,
        article.content_en

      ];


      return fields.some(value=>

        String(value ?? '')
          .toLowerCase()
          .includes(query)

      );

    });


  $('view').innerHTML=`

    <div class="section-title">

      <h2>
        🔎 የፍለጋ ውጤት
      </h2>

      <span class="meta">
        ${results.length} ውጤት
      </span>

    </div>


    <div
      class="grid"
      id="searchResults"
    ></div>

  `;


  const box =
    $('searchResults');


  if(!results.length){

    box.innerHTML=`

      <div class="notice">

        የፈለጉት መረጃ አልተገኘም።

      </div>

    `;

    return;

  }


  box.innerHTML =
    results
      .map(article=>`

        <button
          class="card"
          data-result="${escapeHTML(article.id)}"
        >

          <h3>
            ${escapeHTML(getTitle(article))}
          </h3>

          <p>
            ${escapeHTML(
              getSummary(article)
            )}
          </p>

        </button>

      `)
      .join('');


  document
    .querySelectorAll('[data-result]')
    .forEach(button=>{

      button.onclick=()=>{

        openArticle(
          button.dataset.result
        );

      };

    });

}

/* =========================================================
   LOAD SUPABASE DATA
   ========================================================= */

async function loadData(){

  try{

    const [
      topicsResult,
      articlesResult
    ] = await Promise.all([

      db
        .from('sidama_topics')
        .select('*')
        .eq('is_active',true)
        .order('sort_order'),


      db
        .from('sidama_articles')
        .select('*')
        .eq('editorial_status','published')
        .order('sort_order')
        .limit(1000)

    ]);


    if(topicsResult.error){

      throw new Error(
        topicsResult.error.message
      );

    }


    if(articlesResult.error){

      throw new Error(
        articlesResult.error.message
      );

    }


    topics =
      topicsResult.data || [];


    articles =
      articlesResult.data || [];


    console.log(
      'SIDAAMAN ENWEQ:',
      topics.length,
      'topics /',
      articles.length,
      'published articles'
    );


    renderLanguages();

    showHome();


  }catch(error){

    console.error(
      'SIDAAMAN ENWEQ ERROR:',
      error
    );


    $('view').innerHTML=`

      <div class="notice">

        <strong>
          መረጃውን መጫን አልተቻለም።
        </strong>

        <br><br>

        Supabase ግንኙነት ወይም
        የመረጃ ጠያቂው ላይ
        ችግር ተፈጥሯል።

        <br><br>

        <button
          class="btn primary"
          onclick="location.reload()"
        >
          🔄 እንደገና ሞክር
        </button>

      </div>

    `;

  }

}
